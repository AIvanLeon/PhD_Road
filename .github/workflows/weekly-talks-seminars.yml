name: Weekly Talks & Seminars Reminder

on:
  schedule:
    # 9:00 UTC every Monday
    - cron: '0 9 * * 1'
  workflow_dispatch: {}  # allows manual trigger from GitHub UI

permissions:
  contents: write  # needed to commit data/seen_events.json back

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Build message
        working-directory: reminders/talks_seminars
        run: python build_message.py

      - name: Send to Telegram
        working-directory: reminders/talks_seminars
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py

      - name: Commit updated dedup state
        working-directory: reminders/talks_seminars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update talks/seminars dedup state [skip ci]"
          git push
